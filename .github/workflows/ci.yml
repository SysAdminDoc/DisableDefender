name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -ErrorAction Stop
      - name: Lint
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path . -Settings ./PSScriptAnalyzerSettings.psd1 -Recurse
          $errors = $issues | Where-Object { $_.Severity -eq 'Error' }
          $warnings = $issues | Where-Object { $_.Severity -eq 'Warning' }
          $issues | Format-Table -AutoSize
          if ($errors) {
              Write-Error "$($errors.Count) error(s) and $($warnings.Count) warning(s) found."
          } else {
              Write-Output "$($warnings.Count) warning(s), 0 errors."
          }

  test:
    name: Pester
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Pester Tests
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path ./Tests -PassThru -Output Detailed
          if ($result.FailedCount -gt 0) { exit 1 }
